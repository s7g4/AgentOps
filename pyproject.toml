[project]
name = "s7g4-agentops"
version = "1.0.0"
description = "Multi-agent orchestration backend — FSM pipeline, workflow engine, and agent bus on one substrate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgentOps" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "prometheus-client>=0.20.0",
  "structlog>=24.1.0",
  "python-json-logger>=2.0.7",
  "tenacity>=8.5.0",
  "redis>=5.0.0",
  "anyio[trio]>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/s7g4/AgentOps"
Repository = "https://github.com/s7g4/AgentOps"
Issues = "https://github.com/s7g4/AgentOps/issues"
Changelog = "https://github.com/s7g4/AgentOps/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]
otel = [
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocs-include-markdown-plugin>=6.2.0",
]
loadtest = [
  "locust>=2.29.0",
]


[tool.uv]
# uv can install deps from this file; no additional config needed.

[tool.setuptools.packages.find]
# client/ is a sibling installable package (its own pyproject.toml), not
# part of this distribution — without this, setuptools' flat-layout
# auto-discovery sees both app/ and client/ as top-level packages and
# refuses to build.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "."
files = ["app"]

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.telemetry.*"
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

