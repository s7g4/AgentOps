services:
  agentops:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      # Hardcoded, not `${TRACE_BACKEND:-redis}` — Redis is always present in
      # this topology, and .env.example (meant for bare local dev without
      # Redis running) sets both to `memory`. Docker Compose substitutes
      # variables from the host's .env file, so `${VAR:-redis}` would
      # silently pick up that `memory` default and traces/rate limits
      # wouldn't survive an app-container restart as documented.
      TRACE_BACKEND: redis
      RATE_LIMIT_BACKEND: redis
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Not published to the host — reachable only from the agentops
    # service on the compose network. Publish it yourself if you need
    # host-level access (e.g. for `redis-cli`), but there's no reason a
    # deployed AgentOps instance needs Redis reachable from outside.
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
