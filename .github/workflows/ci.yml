name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint · Type · Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test with coverage
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80 --cov-config=.coveragerc

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t agentops:ci .

      - name: Smoke test image
        run: |
          docker run -d --name agentops_ci -p 8000:8000 agentops:ci
          sleep 6
          curl -sf http://localhost:8000/health || (docker logs agentops_ci && exit 1)
          docker stop agentops_ci
          docker rm agentops_ci
