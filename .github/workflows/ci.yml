name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Lint · Type · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" || pip install .
          pip install pytest-cov pydantic-settings

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80 --cov-config=.coveragerc

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentops:ci .

      - name: Smoke test image
        run: |
          docker run -d --name agentops_ci -p 8000:8000 agentops:ci
          sleep 5
          curl -f http://localhost:8000/health || (docker logs agentops_ci && exit 1)
          docker stop agentops_ci
          docker rm agentops_ci
