# Fly.io app configuration. Non-secret only — set real values with
# `flyctl secrets set` (see DEPLOYMENT.md), never in this file.
#
# First-time setup: `flyctl launch --no-deploy` (reads this file, creates
# the app), then `flyctl secrets set ...`, then `flyctl deploy`.

app = "agentops"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  LOG_LEVEL = "INFO"
  TRACE_BACKEND = "redis"
  RATE_LIMIT_BACKEND = "redis"
  AUTH_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
